name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no floating major tag, unlike actions/*: the exact version is the
      # only ref that resolves. Dependabot bumps it.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .

  test:
    name: test (py${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13"]
        exclude:
          # Two OSes x two Pythons installs torch four times; the macOS run exists to catch
          # MPS-specific regressions, not to re-test the interpreter.
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -q

  package:
    name: build and run the installed wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Build sdist and wheel
        run: uv build
      - name: Check the package metadata
        run: |
          uvx twine check dist/*
      - name: Run the console script from the built wheel (no source tree)
        run: |
          # The version is read from package metadata at runtime, so it must equal the one in
          # pyproject.toml. A drift here means `--version` lies about what was installed.
          reported=$(uv tool run --from dist/*.whl ner-mcp-fr --version)
          expected="ner-mcp-fr $(uv version --short)"
          test "$reported" = "$expected" || {
            echo "version drift: console script reports '$reported', package says '$expected'"
            exit 1
          }
      - name: Smoke test the CLI without downloading the model
        run: uv tool run --from dist/*.whl ner-mcp-fr info
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
